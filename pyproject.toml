[project]
name = "llm-posttrain"
version = "0.1.0"
description = "When to switch from SFT to RL: SFT checkpoint sweep -> GRPO, and PPO vs GRPO, on GSM8K"
requires-python = ">=3.12,<3.13"
dependencies = [
  "torch==2.7.1",
  "vllm==0.10.1.1",
  "transformers>=4.55,<4.57",
  "datasets>=3.6",
  "accelerate",
  "bitsandbytes",
  "pandas",
  "matplotlib",
]

[tool.uv.sources]
torch = { index = "pytorch-cu128" }

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["pt"]
